<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>onenight · השכרת שמלות ערב</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<!-- ── Fonts: Frank Ruhl Libre (display, Hebrew serif) + Assistant (body, Hebrew sans) ── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;600;700;900&family=DM+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500;1,600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">

<!-- ── Tailwind (Play CDN) + design-token config ── -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas:       "rgba(110,44,44,0.08)",
          ink:          "#1A1714",
          muted:        "#8A847C",
          line:         "#E8E4DE",   /* "border" is reserved by Tailwind */
          brand:        "#8B3A3A",
          "brand-dark": "#6E2C2C",
          "brand-light":"#F0E8E8",
          success:      "#4A7C59",
        },
        fontFamily: {
          display: ['"Frank Ruhl Libre"', "Georgia", "serif"],
          body:    ['"Assistant"', "system-ui", "sans-serif"],
          mono:    ['"DM Mono"', "ui-monospace", "monospace"],
          /* editorial luxury pairing — Latin glyphs from these, Hebrew falls back gracefully */
          playfair: ['Playfair Display', 'serif'],
          jost:      ['"Jost"', '"Assistant"', "system-ui", "sans-serif"],
        },
        fontSize: {
          xs:   ["0.75rem",  { lineHeight: "1.1rem"  }],
          sm:   ["0.875rem", { lineHeight: "1.3rem"  }],
          base: ["1rem",     { lineHeight: "1.6rem"  }],
          lg:   ["1.125rem", { lineHeight: "1.7rem"  }],
          xl:   ["1.25rem",  { lineHeight: "1.8rem"  }],
          "2xl":["1.5rem",   { lineHeight: "1.9rem"  }],
          "3xl":["1.875rem", { lineHeight: "2.2rem"  }],
          "4xl":["2.25rem",  { lineHeight: "2.5rem"  }],
          display: ["clamp(2.75rem, 7vw, 5rem)", { lineHeight: "1.04", letterSpacing: "-0.01em" }],
        },
        transitionTimingFunction: {
          lux: "cubic-bezier(0.22, 1, 0.36, 1)",
        },
        boxShadow: {
          modal: "0 24px 70px rgba(26,23,20,0.28), 0 6px 18px rgba(26,23,20,0.10)",
        },
        keyframes: {
          "fade-in":  { from: { opacity: "0" }, to: { opacity: "1" } },
          "scale-in": { from: { opacity: "0", transform: "translateY(8px) scale(.985)" }, to: { opacity: "1", transform: "translateY(0) scale(1)" } },
          "heart-pop":{ "0%": { transform: "scale(1)" }, "45%": { transform: "scale(1.28)" }, "100%": { transform: "scale(1)" } },
          "bob":      { "0%,100%": { transform: "translateY(0)" }, "50%": { transform: "translateY(7px)" } },
        },
        animation: {
          "fade-in":  "fade-in .3s ease forwards",
          "scale-in": "scale-in .3s cubic-bezier(0.22,1,0.36,1) forwards",
          "heart-pop":"heart-pop .35s ease",
          "bob":      "bob 1.8s ease-in-out infinite",
        },
      },
    },
  };
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
