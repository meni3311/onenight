<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>onenight · השכרת שמלות ערב</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAF6F1;
    --card:#FFFFFF;
    --border:#EDE0D4;
    --rose:#C4A0A0;
    --rose-deep:#B08888;
    --gold:#BFA980;
    --text:#2A1F1F;
    --muted:#8C7B7B;
    --sage:#7A8B7B;
    --shadow:0 2px 12px rgba(0,0,0,0.06);
    --shadow-lift:0 10px 28px rgba(0,0,0,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans','Inter',system-ui,sans-serif;
    direction:rtl;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .serif{font-family:'Cormorant Garamond','Playfair Display',serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--rose);color:#fff;}

  /* ---------- Logo ---------- */
  .logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;cursor:pointer;}
  .logo .word{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;letter-spacing:1px;color:var(--text);direction:ltr;}
  .logo .gline{width:100%;height:1px;background:var(--gold);margin:3px 0 4px;}
  .logo .sub{font-size:11px;color:var(--muted);letter-spacing:1px;}

  /* ---------- Header ---------- */
  .header{position:sticky;top:0;z-index:50;background:rgba(250,246,241,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .header-inner{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .nav{display:flex;align-items:center;gap:28px;}
  .nav a{font-size:15px;color:var(--text);position:relative;padding:4px 0;transition:color .2s;}
  .nav a:hover{color:var(--rose-deep);}
  .nav a.active{color:var(--rose-deep);}
  .nav a.active::after{content:"";position:absolute;bottom:-2px;right:0;left:0;height:1px;background:var(--gold);}
  .nav .fav-count{font-size:11px;background:var(--rose);color:#fff;border-radius:9px;padding:0 6px;margin-inline-start:4px;}
  .burger{display:none;background:none;border:none;font-size:22px;color:var(--text);}

  /* ---------- Buttons ---------- */
  .btn{border:none;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:500;transition:all .2s;}
  .btn-rose{background:var(--rose);color:#fff;}
  .btn-rose:hover{background:var(--rose-deep);}
  .btn-sage{background:var(--sage);color:#fff;}
  .btn-sage:hover{filter:brightness(.94);}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--rose);color:var(--rose-deep);}
  .btn-block{width:100%;}

  /* ---------- Hero ---------- */
  .hero{text-align:center;padding:72px 24px 56px;}
  .hero h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:54px;margin:0 0 14px;line-height:1.1;}
  .hero p{font-size:18px;color:var(--muted);max-width:560px;margin:0 auto 30px;}
  .hero .gold-rule{width:60px;height:1px;background:var(--gold);margin:0 auto 26px;}

  /* ---------- Layout ---------- */
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}
  .page{min-height:60vh;padding-bottom:60px;}

  /* ---------- Filter panel ---------- */
  .filters{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:30px;}
  .filters-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--muted);letter-spacing:.3px;}
  .field input[type=text],.field input[type=number],.field input[type=email],.field input[type=tel],.field input[type=password],.field select,.field textarea{
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:var(--text);min-width:150px;outline:none;transition:border-color .2s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;color:var(--muted);transition:all .15s;}
  .chip.on{background:var(--rose);border-color:var(--rose);color:#fff;}
  .chip:hover{border-color:var(--rose);}
  .price-val{font-size:13px;color:var(--text);}
  input[type=range]{accent-color:var(--rose);}
  .radio-row{display:flex;gap:14px;align-items:center;font-size:14px;}
  .radio-row label{display:flex;gap:5px;align-items:center;color:var(--text);cursor:pointer;}
  .filter-toggle{display:none;}

  /* ---------- Grid & Cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;position:relative;}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
  .card-img{position:relative;aspect-ratio:3/4;background:var(--border);overflow:hidden;cursor:pointer;}
  .card-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .heart{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow);transition:transform .15s;}
  .heart:hover{transform:scale(1.1);}
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.15;}
  .card-meta{font-size:13px;color:var(--muted);}
  .card-price{font-size:16px;color:var(--text);font-weight:600;margin-top:2px;}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px;}
  .icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);transition:all .15s;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--rose);color:var(--rose-deep);}
  .badge-pending{position:absolute;top:10px;right:10px;background:var(--gold);color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(42,31,31,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:12px;max-width:900px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;box-shadow:var(--shadow-lift);}
  .modal-close{position:absolute;top:12px;left:12px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .gallery{position:relative;background:var(--border);}
  .gallery-img{aspect-ratio:3/4;width:100%;height:100%;}
  .gallery-img img{width:100%;height:100%;object-fit:cover;}
  .gallery-fade{position:absolute;inset:0;opacity:0;transition:opacity .5s;}
  .gallery-fade.show{opacity:1;}
  .dots{position:absolute;bottom:14px;right:0;left:0;display:flex;gap:7px;justify-content:center;z-index:3;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);border:none;transition:all .2s;}
  .dot.on{background:#fff;width:22px;border-radius:5px;}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;z-index:3;display:flex;align-items:center;justify-content:center;}
  .gnav.r{right:10px;} .gnav.l{left:10px;}
  .modal-body{padding:30px 28px;display:flex;flex-direction:column;gap:14px;}
  .modal-body h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;margin:0;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:4px;}
  .detail-grid .k{font-size:12px;color:var(--muted);}
  .detail-grid .v{font-size:15px;color:var(--text);}
  .divider{height:1px;background:var(--gold);opacity:.5;margin:6px 0;}
  .modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .modal-actions .row{display:flex;gap:10px;}

  /* ---------- Calendar ---------- */
  .cal{border:1px solid var(--border);border-radius:10px;padding:12px;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:10px;color:var(--muted);text-align:center;padding:2px 0;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:6px;border:1px solid transparent;color:var(--text);background:#fff;}
  .cal-day.empty{background:transparent;}
  .cal-day.booked{background:#F0E2E2;color:var(--rose-deep);text-decoration:line-through;}
  .cal-day.selectable{cursor:pointer;}
  .cal-day.selectable:hover{border-color:var(--rose);}
  .cal-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;}
  .cal-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:-2px;}

  /* ---------- Forms / pages ---------- */
  .form-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:30px;max-width:680px;margin:0 auto;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .form-grid .full{grid-column:1/-1;}
  .form-card h2{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;margin:0 0 6px;text-align:center;}
  .form-sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:15px;}
  .dropzone{border:1.5px dashed var(--border);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s;background:#fff;}
  .dropzone:hover,.dropzone.drag{border-color:var(--rose);color:var(--rose-deep);background:#fffdfb;}
  .thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .thumb{position:relative;width:84px;height:108px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb button{position:absolute;top:3px;left:3px;background:rgba(42,31,31,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;}
  .err{color:#b5524f;font-size:12px;}

  /* ---------- Thank you ---------- */
  .thankyou{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
  .thankyou h1{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:500;margin:0 0 18px;}
  .thankyou p{max-width:480px;color:var(--muted);font-size:17px;margin:0 0 24px;line-height:1.7;}

  /* ---------- Footer ---------- */
  .footer{border-top:1px solid var(--border);margin-top:40px;padding:40px 24px;background:#fff;}
  .footer-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;color:var(--muted);font-size:14px;}
  .footer h4{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text);margin:0 0 10px;}
  .footer a:hover{color:var(--rose-deep);}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;z-index:200;box-shadow:var(--shadow-lift);animation:fade .2s;}

  /* ---------- Admin ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .tab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 18px;font-size:14px;color:var(--muted);}
  .tab.on{background:var(--text);color:#fff;border-color:var(--text);}
  .admin-row{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;gap:16px;margin-bottom:14px;align-items:flex-start;}
  .admin-row img{width:90px;height:120px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .status-pill{font-size:11px;padding:3px 10px;border-radius:20px;}
  .status-pending{background:#F5ECDD;color:var(--gold);}
  .status-approved{background:#E6ECE6;color:var(--sage);}
  .status-rejected{background:#F3E2E2;color:var(--rose-deep);}

  .section-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;margin:30px 0 18px;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px;}
  .link-rose{color:var(--rose-deep);border-bottom:1px solid var(--gold);padding-bottom:1px;cursor:pointer;}

  /* ---------- Responsive ---------- */
  @media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:820px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .modal{grid-template-columns:1fr;}
    .nav{display:none;}
    .nav.open{display:flex;position:absolute;top:100%;right:0;left:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px;gap:16px;}
    .burger{display:block;}
    .header-inner{position:relative;}
    .form-grid{grid-template-columns:1fr;}
    .hero h1{font-size:40px;}
    .filter-toggle{display:inline-flex;align-items:center;gap:8px;}
    .filters.collapsed .filters-body{display:none;}
  }
  @media(max-width:520px){
    .grid{grid-template-columns:1fr;}
    .overlay{padding:0;}
    .modal{max-height:100vh;height:100vh;border-radius:0;}
  }
</style>
</head>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react" data-type="script">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================================================
   onenight — Hebrew RTL dress rental marketplace (prototype)
   Self-contained: mock data + localStorage. Backend hooks marked TODO.
   ============================================================ */

/* ---------- Constants (Hebrew) ---------- */
const REGIONS = ["צפון","חיפה והכרמל","מרכז","גוש דן","ירושלים","דרום","שומרון ויהודה"];
const SIZES = ["XS","S","M","L","XL","XXL","34","36","38","40","42","44","46","48","50","52"];
const LENGTHS = ["קצר","בינוני","ארוך"];
const CONDITIONS = ["חדשה","כמו חדשה","טובה מאוד","טובה","סבירה"];
const ADMIN_PASSWORD = "onenight2026"; // demo only — replace with real auth

/* ---------- Soft SVG placeholder (always works offline) ---------- */
function placeholder(color, label){
  const safe = (label||"onenight").slice(0,18);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'>
    <rect width='300' height='400' fill='#FFFFFF'/>
    <rect x='0' y='0' width='300' height='400' fill='${color}' opacity='0.14'/>
    <path d='M150 70 l30 60 -18 0 28 150 -80 0 28 -150 -18 0 z' fill='${color}' opacity='0.5'/>
    <circle cx='150' cy='58' r='14' fill='${color}' opacity='0.5'/>
    <text x='150' y='370' font-family='Cormorant Garamond, serif' font-size='20' fill='#8C7B7B' text-anchor='middle'>${safe}</text>
  </svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

/* ---------- Seed dresses ---------- */
const seedImgs = [
  "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&q=80",
  "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600&q=80",
  "https://images.unsplash.com/photo-1572804013427-4d7ca7268217?w=600&q=80",
  "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=600&q=80",
  "https://images.unsplash.com/photo-1583846783214-7229a91b20ed?w=600&q=80",
  "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=600&q=80",
  "https://images.unsplash.com/photo-1485968579580-b6d095142e6e?w=600&q=80",
  "https://images.unsplash.com/photo-1502716119720-b23a93e5fe1b?w=600&q=80",
];
function img(i){ return seedImgs[i % seedImgs.length]; }

const SEED = [
  {title:"שמלת ערב אדומה זוהרת", desc:"שמלה אדומה ארוכה עם שובל עדין, מושלמת לאירוע מרשים. נלבשה פעם אחת בלבד.", color:"אדום", colorHex:"#B23A48", condition:"כמו חדשה", length:"ארוך", price:280, region:"גוש דן", size:"M", source:"תפירה אישית", store:"", phone:"0521111111", email:"a@x.com"},
  {title:"שמלת מקסי שמפניה", desc:"גוון שמפניה רך עם תחרה צרפתית, מחמיא לכל גוף.", color:"שמפניה", colorHex:"#D9C2A0", condition:"חדשה", length:"ארוך", price:340, region:"מרכז", size:"S", source:"שם חנות", store:"Boutique Lior", phone:"0522222222", email:"b@x.com"},
  {title:"שמלת קוקטייל שחורה", desc:"קלאסיקה שחורה באורך ברך, אלגנטית ונצחית.", color:"שחור", colorHex:"#2A2A2A", condition:"טובה מאוד", length:"בינוני", price:190, region:"ירושלים", size:"L", source:"תפירה אישית", store:"", phone:"0523333333", email:"c@x.com"},
  {title:"שמלת נסיכה תכלת", desc:"גוון תכלת חולמני עם חצאית נפוחה, לאירוע יוצא דופן.", color:"תכלת", colorHex:"#A9C5D6", condition:"כמו חדשה", length:"ארוך", price:310, region:"חיפה והכרמל", size:"M", source:"שם חנות", store:"Dvash", phone:"0524444444", email:"d@x.com"},
  {title:"שמלת זמש ירוק בקבוק", desc:"ירוק עמוק עם גזרה מחטבת, תחושת קטיפה.", color:"ירוק", colorHex:"#3E5A48", condition:"טובה מאוד", length:"ארוך", price:260, region:"צפון", size:"M", source:"תפירה אישית", store:"", phone:"0525555555", email:"e@x.com"},
  {title:"שמלת מיני נצנצים", desc:"שמלת מיני מנצנצת לערב בלתי נשכח, נוחה לריקודים.", color:"כסף", colorHex:"#C8C8CC", condition:"חדשה", length:"קצר", price:170, region:"גוש דן", size:"XS", source:"שם חנות", store:"Glam", phone:"0526666666", email:"f@x.com"},
  {title:"שמלת ערב סגול עמוק", desc:"גוון סגול מלכותי, מחשוף עדין וגב חשוף.", color:"סגול", colorHex:"#5E4B79", condition:"טובה", length:"ארוך", price:220, region:"דרום", size:"L", source:"תפירה אישית", store:"", phone:"0527777777", email:"g@x.com"},
  {title:"שמלת סאטן ורד אבק", desc:"סאטן בגוון ורוד אבקתי, נופל בצורה מושלמת.", color:"ורוד", colorHex:"#C4A0A0", condition:"כמו חדשה", length:"בינוני", price:240, region:"מרכז", size:"S", source:"שם חנות", store:"Rosa", phone:"0528888888", email:"h@x.com"},
].map((d,i)=>({
  id:"seed-"+i,
  status:"approved",
  createdAt:Date.now()-i*86400000,
  booked:[],
  images:[img(i), img(i+1), img(i+2)],
  ...d
}));

/* ---------- localStorage helpers ---------- */
const LS = {
  get(k,f){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
};

/* ---------- Logo ---------- */
function Logo({onClick}){
  return (
    <div className="logo" onClick={onClick} title="onenight">
      <span className="word">onenight</span>
      <span className="gline"></span>
      <span className="sub">השכרת שמלות ערב</span>
    </div>
  );
}

/* ---------- Image with fallback ---------- */
function Img({src, color, label, ...rest}){
  const [err,setErr]=useState(false);
  return <img {...rest} src={err?placeholder(color||"#C4A0A0",label):src}
    onError={()=>setErr(true)} alt={label||""} loading="lazy" />;
}

/* ---------- Heart ---------- */
function Heart({active,onClick}){
  return (
    <button className="heart" onClick={(e)=>{e.stopPropagation();onClick();}} aria-label="מועדפים">
      <span style={{color: active?"#C4A0A0":"#8C7B7B"}}>{active?"♥":"♡"}</span>
    </button>
  );
}

/* ============================================================
   Filters panel
   ============================================================ */
function MultiChips({options,selected,onToggle}){
  return (
    <div className="chips">
      {options.map(o=>(
        <button key={o} className={"chip"+(selected.includes(o)?" on":"")} onClick={()=>onToggle(o)}>{o}</button>
      ))}
    </div>
  );
}

function Filters({f,setF}){
  const [open,setOpen]=useState(false);
  const toggleArr=(key,val)=>{
    setF(p=>({...p,[key]: p[key].includes(val)? p[key].filter(x=>x!==val): [...p[key],val]}));
  };
  return (
    <div className={"filters"+(open?"":" collapsed")}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <strong className="serif" style={{fontSize:20}}>סינון וחיפוש</strong>
        <button className="btn btn-ghost filter-toggle" onClick={()=>setOpen(o=>!o)}>
          ⚙ {open?"סגירה":"סינון"}
        </button>
      </div>
      <div className="filters-body" style={{marginTop:16}}>
        <div className="filters-row">
          <div className="field" style={{flex:"1 1 220px"}}>
            <label>חיפוש חופשי</label>
            <input type="text" placeholder="חיפוש לפי שם, צבע, תיאור…" value={f.q} onChange={e=>setF(p=>({...p,q:e.target.value}))}/>
          </div>
          <div className="field" style={{flex:"1 1 160px"}}>
            <label>צבע</label>
            <input type="text" placeholder="לדוגמה: אדום" value={f.color} onChange={e=>setF(p=>({...p,color:e.target.value}))}/>
          </div>
          <div className="field">
            <label>טווח מחירים — עד {f.maxPrice} ₪</label>
            <input type="range" min="50" max="500" step="10" value={f.maxPrice} onChange={e=>setF(p=>({...p,maxPrice:+e.target.value}))}/>
          </div>
        </div>

        <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:14}}>
          <div className="field"><label>אזור</label><MultiChips options={REGIONS} selected={f.regions} onToggle={v=>toggleArr("regions",v)}/></div>
          <div className="field"><label>מידה</label><MultiChips options={SIZES} selected={f.sizes} onToggle={v=>toggleArr("sizes",v)}/></div>
          <div style={{display:"flex",gap:30,flexWrap:"wrap"}}>
            <div className="field"><label>אורך</label><MultiChips options={LENGTHS} selected={f.lengths} onToggle={v=>toggleArr("lengths",v)}/></div>
            <div className="field"><label>מצב השמלה</label><MultiChips options={CONDITIONS} selected={f.conditions} onToggle={v=>toggleArr("conditions",v)}/></div>
          </div>
          <div className="field">
            <label>מקור</label>
            <div className="radio-row">
              {[["all","הכל"],["תפירה אישית","תפירה אישית"],["שם חנות","חנות"]].map(([v,l])=>(
                <label key={v}><input type="radio" name="source" checked={f.source===v} onChange={()=>setF(p=>({...p,source:v}))}/>{l}</label>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Availability calendar
   ============================================================ */
function Calendar({booked=[], editable=false, onToggle}){
  const [m,setM]=useState(()=>{const d=new Date();return {y:d.getFullYear(),mo:d.getMonth()};});
  const dow=["א","ב","ג","ד","ה","ו","ש"];
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const first=new Date(m.y,m.mo,1).getDay();
  const days=new Date(m.y,m.mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  const key=d=>`${m.y}-${String(m.mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const shift=n=>setM(p=>{let mo=p.mo+n,y=p.y;if(mo<0){mo=11;y--;}if(mo>11){mo=0;y++;}return{y,mo};});
  return (
    <div className="cal">
      <div className="cal-head">
        <button className="icon-btn" style={{width:30,height:30}} onClick={()=>shift(-1)}>›</button>
        <span className="serif" style={{fontSize:17}}>{monthNames[m.mo]} {m.y}</span>
        <button className="icon-btn" style={{width:30,height:30}} onClick={()=>shift(1)}>‹</button>
      </div>
      <div className="cal-grid">
        {dow.map(d=><div key={d} className="cal-dow">{d}</div>)}
        {cells.map((d,i)=>{
          if(d===null)return <div key={i} className="cal-day empty"></div>;
          const k=key(d);
          const isBooked=booked.includes(k);
          const cls="cal-day"+(isBooked?" booked":"")+(editable?" selectable":"");
          return <div key={i} className={cls} onClick={editable?()=>onToggle(k):undefined}>{d}</div>;
        })}
      </div>
      <div className="cal-legend">
        <span><span className="sw" style={{background:"#fff",border:"1px solid var(--border)"}}></span>פנוי</span>
        <span><span className="sw" style={{background:"#F0E2E2"}}></span>תפוס</span>
        {editable && <span style={{color:"var(--rose-deep)"}}>לחצי על תאריך לסימון</span>}
      </div>
    </div>
  );
}

/* ============================================================
   Detail Modal
   ============================================================ */
function DetailModal({d, fav, onFav, onClose, toast}){
  const [idx,setIdx]=useState(0);
  const [showShare,setShowShare]=useState(false);
  useEffect(()=>{const h=e=>{if(e.key==="Escape")onClose();};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[]);
  const link=location.origin+location.pathname+"#dress="+d.id;
  const wa=`https://wa.me/972${d.phone.replace(/^0/,"")}?text=${encodeURIComponent("היי! ראיתי את השמלה \""+d.title+"\" ב-onenight ואשמח לפרטים 🌸")}`;
  const waShare=`https://wa.me/?text=${encodeURIComponent("מצאתי שמלה מהממת ב-onenight: "+d.title+" — "+link)}`;
  const copy=()=>{navigator.clipboard?.writeText(link);toast("הקישור הועתק 🔗");setShowShare(false);};
  const rows=[
    ["צבע",d.color],["מצב",d.condition],["אורך",d.length],["מידה",d.size],
    ["מחיר",d.price+" ₪ לערב"],["אזור",d.region],["מקור", d.source==="שם חנות"? (d.store||"חנות"):d.source],
  ];
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="gallery">
          {d.images.map((src,i)=>(
            <div key={i} className={"gallery-fade"+(i===idx?" show":"")}>
              <div className="gallery-img"><Img src={src} color={d.colorHex} label={d.title}/></div>
            </div>
          ))}
          {/* keep height */}
          <div className="gallery-img" style={{visibility:"hidden"}}><Img src={d.images[0]} color={d.colorHex} label={d.title}/></div>
          {d.images.length>1 && <>
            <button className="gnav r" onClick={()=>setIdx(i=>(i+1)%d.images.length)}>›</button>
            <button className="gnav l" onClick={()=>setIdx(i=>(i-1+d.images.length)%d.images.length)}>‹</button>
            <div className="dots">{d.images.map((_,i)=><button key={i} className={"dot"+(i===idx?" on":"")} onClick={()=>setIdx(i)}/>)}</div>
          </>}
        </div>
        <div className="modal-body">
          <h2>{d.title}</h2>
          <p style={{color:"var(--muted)",margin:0}}>{d.desc}</p>
          <div className="divider"></div>
          <div className="detail-grid">
            {rows.map(([k,v])=>(<div key={k}><div className="k">{k}</div><div className="v">{v}</div></div>))}
          </div>
          <div className="divider"></div>
          <div>
            <div className="k" style={{fontSize:13,color:"var(--muted)",marginBottom:8}}>זמינות</div>
            <Calendar booked={d.booked}/>
          </div>
          <div className="modal-actions">
            <button className={"btn "+(fav?"btn-rose":"btn-ghost")} onClick={()=>onFav(d.id)}>
              {fav?"♥ נשמר במועדפים":"♡ שמירה למועדפים"}
            </button>
            <div className="row">
              <a className="btn btn-sage" style={{flex:1,textAlign:"center"}} href={wa} target="_blank" rel="noopener">📱 צרי קשר</a>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowShare(s=>!s)}>🔗 שיתוף</button>
            </div>
            {showShare && (
              <div className="row">
                <a className="btn btn-ghost" style={{flex:1,textAlign:"center"}} href={waShare} target="_blank" rel="noopener">שיתוף בוואטסאפ</a>
                <button className="btn btn-ghost" style={{flex:1}} onClick={copy}>העתקת קישור</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

   Publish form

function Field({label, children, error}){
  return <div className="field full" style={{gridColumn: undefined}}>
    <label>{label}</label>{children}{error && <span className="err">{error}</span>}
  </div>;
}

function PublishPage({onSubmit, goHome}){
  const empty={title:"",desc:"",color:"",condition:"",length:"",price:"",region:"",size:"",source:"",store:"",phone:"",email:""};
  const [v,setV]=useState(empty);
  const [images,setImages]=useState([]);
  const [errors,setErrors]=useState({});
  const [drag,setDrag]=useState(false);
  const fileRef=useRef();
  const set=(k,val)=>setV(p=>({...p,[k]:val}));

  const handleFiles=(list)=>{
    const arr=Array.from(list).slice(0,3-images.length);
    arr.forEach(file=>{
      const r=new FileReader();
      r.onload=e=>setImages(p=>p.length<3?[...p,e.target.result]:p);
      r.readAsDataURL(file);
    });
  };
  const validate=()=>{
    const e={};
    if(!v.title.trim())e.title="נא להזין כותרת";
    if(!v.desc.trim())e.desc="נא להזין תיאור";
    if(!v.condition)e.condition="נא לבחור מצב";
    if(!v.length)e.length="נא לבחור אורך";
    if(!v.price||+v.price<=0)e.price="נא להזין מחיר";
    if(!v.region)e.region="נא לבחור אזור";
    if(!v.size)e.size="נא לבחור מידה";
    if(!v.source)e.source="נא לבחור מקור";
    if(v.source==="שם חנות"&&!v.store.trim())e.store="נא להזין שם חנות";
    if(!/^0\d{8,9}$/.test(v.phone.trim()))e.phone="מספר טלפון לא תקין";
    if(!/^\S+@\S+\.\S+$/.test(v.email.trim()))e.email="כתובת מייל לא תקינה";
    if(images.length===0)e.images="נא להעלות לפחות תמונה אחת";
    setErrors(e);
    return Object.keys(e).length===0;
  };
  const submit=()=>{
    if(!validate()){window.scrollTo({top:0,behavior:"smooth"});return;}
    onSubmit({...v, price:+v.price, images, colorHex:"#C4A0A0"});
  };

  return (
    <div className="container page" style={{paddingTop:40}}>
      <div className="form-card">
        <h2>פרסום שמלה</h2>
        <p className="form-sub">ללא צורך בהרשמה · נבדוק את המודעה ונחזור אלייך תוך 24–48 שעות</p>
        <div className="form-grid">
          <div className="field full"><label>כותרת</label>
            <input type="text" placeholder="לדוגמה: שמלת ערב אדומה זוהרת" value={v.title} onChange={e=>set("title",e.target.value)}/>
            {errors.title&&<span className="err">{errors.title}</span>}</div>

          <div className="field full"><label>תיאור</label>
            <textarea rows="3" placeholder="ספרי על השמלה — סגנון, גזרה, מתי נלבשה…" value={v.desc} onChange={e=>set("desc",e.target.value)}/>
            {errors.desc&&<span className="err">{errors.desc}</span>}</div>

          <div className="field"><label>צבע</label>
            <input type="text" placeholder="לדוגמה: אדום" value={v.color} onChange={e=>set("color",e.target.value)}/></div>

          <div className="field"><label>מצב השמלה</label>
            <select value={v.condition} onChange={e=>set("condition",e.target.value)}>
              <option value="">בחרי…</option>{CONDITIONS.map(c=><option key={c}>{c}</option>)}
            </select>{errors.condition&&<span className="err">{errors.condition}</span>}</div>

          <div className="field"><label>אורך</label>
            <select value={v.length} onChange={e=>set("length",e.target.value)}>
              <option value="">בחרי…</option>{LENGTHS.map(c=><option key={c}>{c}</option>)}
            </select>{errors.length&&<span className="err">{errors.length}</span>}</div>

          <div className="field"><label>מחיר להשכרה ₪</label>
            <input type="number" placeholder="0" value={v.price} onChange={e=>set("price",e.target.value)}/>
            {errors.price&&<span className="err">{errors.price}</span>}</div>

          <div className="field"><label>אזור</label>
            <select value={v.region} onChange={e=>set("region",e.target.value)}>
              <option value="">בחרי…</option>{REGIONS.map(c=><option key={c}>{c}</option>)}
            </select>{errors.region&&<span className="err">{errors.region}</span>}</div>

          <div className="field"><label>מידה</label>
            <select value={v.size} onChange={e=>set("size",e.target.value)}>
              <option value="">בחרי…</option>{SIZES.map(c=><option key={c}>{c}</option>)}
            </select>{errors.size&&<span className="err">{errors.size}</span>}</div>

          <div className="field"><label>מקור</label>
            <select value={v.source} onChange={e=>set("source",e.target.value)}>
              <option value="">בחרי…</option><option>תפירה אישית</option><option>שם חנות</option>
            </select>{errors.source&&<span className="err">{errors.source}</span>}</div>

          {v.source==="שם חנות" && <div className="field"><label>שם החנות</label>
            <input type="text" placeholder="שם החנות" value={v.store} onChange={e=>set("store",e.target.value)}/>
            {errors.store&&<span className="err">{errors.store}</span>}</div>}

          <div className="field"><label>טלפון (לוואטסאפ, לא יוצג במלואו)</label>
            <input type="tel" placeholder="05X-XXXXXXX" value={v.phone} onChange={e=>set("phone",e.target.value)}/>
            {errors.phone&&<span className="err">{errors.phone}</span>}</div>

          <div className="field"><label>מייל (לעדכונים)</label>
            <input type="email" placeholder="your@email.com" value={v.email} onChange={e=>set("email",e.target.value)}/>
            {errors.email&&<span className="err">{errors.email}</span>}</div>

          <div className="field full"><label>תמונות (עד 3)</label>
            <div className={"dropzone"+(drag?" drag":"")}
              onClick={()=>fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();setDrag(true);}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFiles(e.dataTransfer.files);}}>
              {images.length<3?"גררי לכאן תמונות או לחצי לבחירה":"הגעת למקסימום (3 תמונות)"}
            </div>
            <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
            {errors.images&&<span className="err">{errors.images}</span>}
            {images.length>0 && <div className="thumbs">
              {images.map((src,i)=>(<div key={i} className="thumb">
                <img src={src} alt=""/><button onClick={()=>setImages(p=>p.filter((_,j)=>j!==i))}>✕</button>
              </div>))}
            </div>}
          </div>

          <div className="full" style={{marginTop:8}}>
            <button className="btn btn-rose btn-block" onClick={submit}>פרסום השמלה</button>
            <div style={{textAlign:"center",marginTop:14}}><span className="link-rose" onClick={goHome}>חזרה לעמוד הבית</span></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Auth (login / register)  — demo, stored in localStorage
   ============================================================ */
function AuthPage({mode:initMode, onAuth, goHome, toast}){
  const [mode,setMode]=useState(initMode||"login");
  const [v,setV]=useState({name:"",email:"",city:"",phone:"",password:""});
  const [code,setCode]=useState("");
  const [stage,setStage]=useState("form");
  const set=(k,val)=>setV(p=>({...p,[k]:val}));

  const startRegister=()=>{
    if(!v.name||!v.phone||!v.password){toast("נא למלא שם, טלפון וסיסמה");return;}
    // TODO: real SMS via Twilio. Demo: pretend code is 1234
    setStage("verify");
    toast("נשלח קוד אימות (לצורך הדגמה: 1234)");
  };
  const verify=()=>{
    if(code!=="1234"){toast("קוד שגוי — נסי 1234 להדגמה");return;}
    onAuth({name:v.name,email:v.email,city:v.city,phone:v.phone});
  };
  const login=()=>{
    if(!v.phone||!v.password){toast("נא להזין טלפון וסיסמה");return;}
    onAuth({name:v.name||"חברה",email:v.email,city:v.city,phone:v.phone});
  };

  return (
    <div className="container page" style={{paddingTop:50}}>
      <div className="form-card" style={{maxWidth:440}}>
        <h2>{mode==="login"?"כניסה":"הרשמה"}</h2>
        <p className="form-sub">{mode==="login"?"שמחות לראות אותך שוב":"הצטרפי לקהילת onenight"}</p>

        {stage==="form" && <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {mode==="register" && <>
            <div className="field"><label>שם מלא</label><input type="text" value={v.name} onChange={e=>set("name",e.target.value)}/></div>
            <div className="field"><label>מייל</label><input type="email" value={v.email} onChange={e=>set("email",e.target.value)}/></div>
            <div className="field"><label>מקום מגורים</label><input type="text" value={v.city} onChange={e=>set("city",e.target.value)}/></div>
          </>}
          <div className="field"><label>טלפון</label><input type="tel" placeholder="05X-XXXXXXX" value={v.phone} onChange={e=>set("phone",e.target.value)}/></div>
          <div className="field"><label>סיסמה</label><input type="password" value={v.password} onChange={e=>set("password",e.target.value)}/></div>
          <button className="btn btn-rose btn-block" onClick={mode==="login"?login:startRegister}>
            {mode==="login"?"כניסה":"המשך לאימות"}
          </button>
          <div style={{textAlign:"center",fontSize:14,color:"var(--muted)"}}>
            {mode==="login"? <>אין לך חשבון? <span className="link-rose" onClick={()=>setMode("register")}>להרשמה</span></>
              : <>כבר רשומה? <span className="link-rose" onClick={()=>setMode("login")}>לכניסה</span></>}
          </div>
        </div>}

        {stage==="verify" && <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <p style={{color:"var(--muted)",fontSize:14,textAlign:"center"}}>הזיני את קוד האימות שנשלח ל-{v.phone}</p>
          <div className="field"><label>קוד אימות (SMS)</label><input type="text" placeholder="1234" value={code} onChange={e=>setCode(e.target.value)}/></div>
          <button className="btn btn-rose btn-block" onClick={verify}>אימות והרשמה</button>
        </div>}
      </div>
    </div>
  );
}

   Account area
   ============================================================ */
function AccountPage({user, dresses, setDresses, favIds, dressById, onOpen, onFav, setUser, toast}){
  const [tab,setTab]=useState("ads");
  const [editing,setEditing]=useState(null);
  const myAds=dresses.filter(d=>d.phone===user.phone);
  const favs=favIds.map(dressById).filter(Boolean);

  const saveEdit=()=>{
    setDresses(p=>p.map(d=>d.id===editing.id?editing:d));
    setEditing(null);toast("הפרטים עודכנו ✓");
  };
  const toggleDate=(dressId,key)=>{
    setDresses(p=>p.map(d=>d.id===dressId?{...d,booked:d.booked.includes(key)?d.booked.filter(x=>x!==key):[...d.booked,key]}:d));
  };

  return (
    <div className="container page" style={{paddingTop:30}}>
      <h2 className="section-title">האזור האישי · שלום {user.name}</h2>
      <div className="tabs">
        {[["ads","המודעות שלי"],["cal","יומן זמינות"],["favs","מועדפים"],["account","פרטי חשבון"]].map(([k,l])=>(
          <button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      {tab==="ads" && (myAds.length? myAds.map(d=>(
        <div key={d.id} className="admin-row">
          <img src={d.images[0]} alt="" onError={e=>e.target.src=placeholder(d.colorHex,d.title)}/>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <strong className="serif" style={{fontSize:20}}>{d.title}</strong>
              <span className={"status-pill status-"+d.status}>{d.status==="approved"?"מאושרת":d.status==="pending"?"ממתינה":"נדחתה"}</span>
            </div>
            <div className="card-meta">מידה {d.size} · {d.region} · {d.price} ₪</div>
            {editing&&editing.id===d.id ? <EditFields d={editing} setD={setEditing}/> :
              <div style={{marginTop:10,display:"flex",gap:8}}>
                <button className="btn btn-ghost" onClick={()=>setEditing(d)}>✏️ עריכה</button>
                <button className="btn btn-ghost" onClick={()=>onOpen(d)}>תצוגה</button>
              </div>}
            {editing&&editing.id===d.id && <div style={{marginTop:10,display:"flex",gap:8}}>
              <button className="btn btn-sage" onClick={saveEdit}>שמירה</button>
              <button className="btn btn-ghost" onClick={()=>setEditing(null)}>ביטול</button>
            </div>}
            <p style={{fontSize:12,color:"var(--muted)",marginTop:8}}>לשינוי תמונה יש לפנות לשירות לקוחות</p>
          </div>
        </div>
      )) : <div className="empty">עדיין אין לך מודעות. <span className="link-rose" onClick={()=>toast("מעבר לפרסום שמלה")}>פרסמי שמלה ראשונה</span></div>)}

      {tab==="cal" && (myAds.length? myAds.map(d=>(
        <div key={d.id} style={{marginBottom:24}}>
          <strong className="serif" style={{fontSize:19}}>{d.title}</strong>
          <p style={{fontSize:13,color:"var(--muted)",margin:"4px 0 10px"}}>סמני תאריכים שבהם השמלה אינה זמינה</p>
          <div style={{maxWidth:320}}><Calendar booked={d.booked} editable onToggle={k=>toggleDate(d.id,k)}/></div>
        </div>
      )) : <div className="empty">אין מודעות להצגת יומן.</div>)}

      {tab==="favs" && (favs.length? <div className="grid">
        {favs.map(d=><DressCard key={d.id} d={d} fav={true} onFav={onFav} onOpen={onOpen} onShare={()=>toast("שיתוף")}/>)}
      </div> : <div className="empty">עדיין אין מועדפים — לחצי על הלב בשמלות שאהבת ♡</div>)}

      {tab==="account" && <div className="form-card" style={{maxWidth:440,margin:0}}>
        <div className="field" style={{marginBottom:14}}><label>שם מלא</label><input type="text" value={user.name} onChange={e=>setUser({...user,name:e.target.value})}/></div>
        <div className="field" style={{marginBottom:14}}><label>מייל</label><input type="email" value={user.email||""} onChange={e=>setUser({...user,email:e.target.value})}/></div>
        <div className="field" style={{marginBottom:14}}><label>מקום מגורים</label><input type="text" value={user.city||""} onChange={e=>setUser({...user,city:e.target.value})}/></div>
        <div className="field" style={{marginBottom:18}}><label>טלפון</label><input type="tel" value={user.phone} disabled style={{opacity:.7}}/></div>
        <button className="btn btn-rose btn-block" onClick={()=>toast("פרטי החשבון נשמרו ✓")}>שמירת שינויים</button>
      </div>}
    </div>
  );
}

function EditFields({d,setD}){
  const set=(k,val)=>setD(p=>({...p,[k]:val}));
  return (
    <div className="form-grid" style={{marginTop:12}}>
      <div className="field full"><label>כותרת</label><input type="text" value={d.title} onChange={e=>set("title",e.target.value)}/></div>
      <div className="field full"><label>תיאור</label><textarea rows="2" value={d.desc} onChange={e=>set("desc",e.target.value)}/></div>
      <div className="field"><label>צבע</label><input type="text" value={d.color} onChange={e=>set("color",e.target.value)}/></div>
      <div className="field"><label>מחיר ₪</label><input type="number" value={d.price} onChange={e=>set("price",+e.target.value)}/></div>
      <div className="field"><label>מצב</label><select value={d.condition} onChange={e=>set("condition",e.target.value)}>{CONDITIONS.map(c=><option key={c}>{c}</option>)}</select></div>
      <div className="field"><label>אורך</label><select value={d.length} onChange={e=>set("length",e.target.value)}>{LENGTHS.map(c=><option key={c}>{c}</option>)}</select></div>
      <div className="field"><label>אזור</label><select value={d.region} onChange={e=>set("region",e.target.value)}>{REGIONS.map(c=><option key={c}>{c}</option>)}</select></div>
      <div className="field"><label>מידה</label><select value={d.size} onChange={e=>set("size",e.target.value)}>{SIZES.map(c=><option key={c}>{c}</option>)}</select></div>
    </div>
  );
}

/* ============================================================
   Admin panel
   ============================================================ */
function AdminPage({dresses, setDresses, toast}){
  const [authed,setAuthed]=useState(false);
  const [pw,setPw]=useState("");
  const [tab,setTab]=useState("pending");
  const [rejecting,setRejecting]=useState(null);
  const [reason,setReason]=useState("");

  if(!authed) return (
    <div className="container page" style={{paddingTop:50}}>
      <div className="form-card" style={{maxWidth:400}}>
        <h2>כניסת מנהלת</h2>
        <p className="form-sub">אזור מוגן — בעלות האתר בלבד</p>
        <div className="field" style={{marginBottom:16}}><label>סיסמה</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="הסיסמה: onenight2026"/></div>
        <button className="btn btn-rose btn-block" onClick={()=>{ if(pw===ADMIN_PASSWORD){setAuthed(true);} else {toast("סיסמה שגויה");} }}>כניסה</button>
      </div>
    </div>
  );

  const filtered=dresses.filter(d=>d.status===tab);
  const approve=(d)=>{
    setDresses(p=>p.map(x=>x.id===d.id?{...x,status:"approved"}:x));
    toast("השמלה אושרה ✓ — נשלח מייל למפרסמת");
    sendEmail("approve",d);
  };
  const doReject=()=>{
    setDresses(p=>p.map(x=>x.id===rejecting.id?{...x,status:"rejected",rejectReason:reason}:x));
    sendEmail("reject",{...rejecting,rejectReason:reason});
    toast("השמלה נדחתה — נשלח מייל למפרסמת");
    setRejecting(null);setReason("");
  };

  return (
    <div className="container page" style={{paddingTop:30}}>
      <h2 className="section-title">פאנל ניהול</h2>
      <div className="tabs">
        {[["pending","ממתינות"],["approved","מאושרות"],["rejected","נדחו"]].map(([k,l])=>(
          <button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>
            {l} ({dresses.filter(d=>d.status===k).length})
          </button>
        ))}
      </div>
      {filtered.length===0 && <div className="empty">אין שמלות בקטגוריה זו.</div>}
      {filtered.map(d=>{
        const wa=`https://wa.me/972${d.phone.replace(/^0/,"")}?text=${encodeURIComponent('היי, קיבלנו את המודעה שלך לשמלה '+d.title+'. התמונה שצירפת לא ברורה מספיק — תשמחי לשלוח תמונה טובה יותר? 🙏')}`;
        return (
        <div key={d.id} className="admin-row">
          <img src={d.images[0]} alt="" onError={e=>e.target.src=placeholder(d.colorHex,d.title)}/>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <strong className="serif" style={{fontSize:20}}>{d.title}</strong>
              <span className={"status-pill status-"+d.status}>{d.status==="approved"?"מאושרת":d.status==="pending"?"ממתינה":"נדחתה"}</span>
            </div>
            <div className="card-meta">{d.color} · מידה {d.size} · {d.length} · {d.region} · {d.price} ₪</div>
            <div className="card-meta">מקור: {d.source==="שם חנות"?d.store:d.source} · טלפון: {d.phone} · {d.email}</div>
            <p style={{fontSize:13,margin:"6px 0",color:"var(--text)"}}>{d.desc}</p>
            {d.rejectReason && <p className="err">סיבת דחייה: {d.rejectReason}</p>}
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8}}>
              {d.status!=="approved" && <button className="btn btn-sage" onClick={()=>approve(d)}>✅ אישור</button>}
              {d.status!=="rejected" && <button className="btn btn-ghost" onClick={()=>setRejecting(d)}>❌ דחייה</button>}
              <a className="btn btn-ghost" href={wa} target="_blank" rel="noopener">📱 בקשת תמונה</a>
            </div>
            {rejecting&&rejecting.id===d.id && <div style={{marginTop:10}}>
              <input type="text" placeholder="סיבת הדחייה (תופיע במייל למפרסמת)" value={reason} onChange={e=>setReason(e.target.value)} style={{width:"100%",padding:10,border:"1px solid var(--border)",borderRadius:8,marginBottom:8}}/>
              <button className="btn btn-rose" onClick={doReject} disabled={!reason.trim()}>שליחת דחייה</button>
              <button className="btn btn-ghost" style={{marginInlineStart:8}} onClick={()=>setRejecting(null)}>ביטול</button>
            </div>}
          </div>
        </div>);
      })}
    </div>
  );
}

/* ---------- Email stub (would call Resend/EmailJS) ---------- */
function sendEmail(type, d){
  // TODO: integrate Resend / EmailJS. For now we log the branded HTML.
  const link=location.origin+location.pathname+"#dress="+d.id;
  if(type==="approve"){
    console.log("[EMAIL → "+d.email+"] נושא: השמלה שלך התקבלה לאתר onenight! 🎉\n"+
      "שלום, שמחות לבשר שהשמלה \""+d.title+"\" עלתה לאתר ומחכה לשוכרת הבאה. צפייה: "+link);
  } else {
    console.log("[EMAIL → "+d.email+"] נושא: עדכון לגבי המודעה שלך ב-onenight\n"+
      "שלום, לצערנו המודעה \""+d.title+"\" לא אושרה כרגע. סיבה: "+(d.rejectReason||"")+". נשמח שתעדכני ותשלחי שוב 💛");
  }
}

/* ============================================================
   Root App
   ============================================================ */
function App(){
  const [route,setRoute]=useState(()=> location.hash.replace("#","")==="admin"?"admin":"home");
  const [dresses,setDresses]=useState(()=>{
    const saved=LS.get("onenight_dresses",null);
    return saved||SEED;
  });
  const [user,setUser]=useState(()=>LS.get("onenight_user",null));
  const [favIds,setFavIds]=useState(()=>LS.get("onenight_favs",[]));
  const [selected,setSelected]=useState(null);
  const [toastMsg,setToastMsg]=useState(null);
  const [navOpen,setNavOpen]=useState(false);
  const [authMode,setAuthMode]=useState("login");
  const [f,setF]=useState({q:"",color:"",maxPrice:500,regions:[],sizes:[],lengths:[],conditions:[],source:"all"});

  useEffect(()=>LS.set("onenight_dresses",dresses),[dresses]);
  useEffect(()=>LS.set("onenight_favs",favIds),[favIds]);
  useEffect(()=>LS.set("onenight_user",user),[user]);
  useEffect(()=>{
    const h=()=>{ if(location.hash.replace("#","")==="admin") setRoute("admin"); };
    window.addEventListener("hashchange",h); return()=>window.removeEventListener("hashchange",h);
  },[]);

  const toast=(m)=>{setToastMsg(m);clearTimeout(window.__t);window.__t=setTimeout(()=>setToastMsg(null),2600);};
  const dressById=(id)=>dresses.find(d=>d.id===id);
  const toggleFav=(id)=>{
    setFavIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  };
  const go=(r)=>{setRoute(r);setNavOpen(false);window.scrollTo({top:0});if(r!=="admin"&&location.hash)history.replaceState(null,"",location.pathname);};

  const onAuth=(u)=>{ // merge guest favs already in favIds (persisted) — nothing to merge separately in demo
    setUser(u); setRoute("account"); toast("ברוכה הבאה, "+u.name+" 🌸");
  };
  const logout=()=>{setUser(null);go("home");toast("התנתקת בהצלחה");};

  const publish=(data)=>{
    const d={...data, id:"u-"+Date.now(), status:"pending", createdAt:Date.now(), booked:[]};
    setDresses(p=>[d,...p]);
    setRoute("thankyou");window.scrollTo({top:0});
  };

  /* ----- filtering ----- */
  const visible=useMemo(()=>{
    return dresses.filter(d=>d.status==="approved").filter(d=>{
      if(f.q){const q=f.q.toLowerCase();const hay=(d.title+d.desc+d.color+d.region).toLowerCase();if(!hay.includes(q))return false;}
      if(f.color && !d.color.includes(f.color.trim()))return false;
      if(d.price>f.maxPrice)return false;
      if(f.regions.length && !f.regions.includes(d.region))return false;
      if(f.sizes.length && !f.sizes.includes(d.size))return false;
      if(f.lengths.length && !f.lengths.includes(d.length))return false;
      if(f.conditions.length && !f.conditions.includes(d.condition))return false;
      if(f.source!=="all" && d.source!==f.source)return false;
      return true;
    });
  },[dresses,f]);

  const NavLinks=()=>(
    <>
      <a className={route==="home"?"active":""} onClick={()=>go("home")}>בית</a>
      <a className={route==="publish"?"active":""} onClick={()=>go("publish")}>פרסמי שמלה</a>
      <a className={route==="favorites"?"active":""} onClick={()=>go("favorites")}>מועדפים{favIds.length>0&&<span className="fav-count">{favIds.length}</span>}</a>
      {user ? <>
        <a className={route==="account"?"active":""} onClick={()=>go("account")}>האזור האישי</a>
        <a onClick={logout}>יציאה</a>
      </> : <a className={route==="login"?"active":""} onClick={()=>{setAuthMode("login");go("login");}}>כניסה</a>}
    </>
  );

  return (
    <div>
      <header className="header">
        <div className="header-inner">
          <Logo onClick={()=>go("home")}/>
          <button className="burger" onClick={()=>setNavOpen(o=>!o)}>☰</button>
          <nav className={"nav"+(navOpen?" open":"")}><NavLinks/></nav>
        </div>
      </header>

      {route==="home" && <>
        <section className="hero">
          <div className="gold-rule"></div>
          <h1>השמלה המושלמת לערב הגדול שלך</h1>
          <p>מאות שמלות ערב להשכרה מנשים בכל הארץ. מצאי את השמלה שתגרום לך להרגיש כמו כוכבת — או פרסמי שמלה שאהבת ותני לה במה נוספת.</p>
          <button className="btn btn-rose" onClick={()=>go("publish")}>פרסמי שמלה עכשיו</button>
        </section>
        <div className="container page">
          <Filters f={f} setF={setF}/>
          {visible.length? <div className="grid">
            {visible.map(d=><DressCard key={d.id} d={d} fav={favIds.includes(d.id)} onFav={toggleFav} onOpen={setSelected} onShare={(dd)=>{navigator.clipboard?.writeText(location.origin+location.pathname+"#dress="+dd.id);toast("הקישור הועתק 🔗");}}/>)}
          </div> : <div className="empty">לא נמצאו שמלות התואמות את הסינון. נסי להרחיב את החיפוש.</div>}
        </div>
      </>}

      {route==="publish" && <PublishPage onSubmit={publish} goHome={()=>go("home")}/>}
      {route==="thankyou" && <ThankYou goHome={()=>go("home")}/>}

      {route==="favorites" && <div className="container page" style={{paddingTop:30}}>
        <h2 className="section-title">המועדפים שלי</h2>
        {favIds.length? <div className="grid">
          {favIds.map(dressById).filter(Boolean).map(d=><DressCard key={d.id} d={d} fav={true} onFav={toggleFav} onOpen={setSelected} onShare={(dd)=>{navigator.clipboard?.writeText(location.origin+location.pathname+"#dress="+dd.id);toast("הקישור הועתק 🔗");}}/>)}
        </div> : <div className="empty">עדיין לא שמרת שמלות. לחצי על הלב ♡ בשמלות שאהבת והן יופיעו כאן.</div>}
      </div>}

      {route==="login" && <AuthPage mode={authMode} onAuth={onAuth} goHome={()=>go("home")} toast={toast}/>}

      {route==="account" && user && <AccountPage user={user} dresses={dresses} setDresses={setDresses}
        favIds={favIds} dressById={dressById} onOpen={setSelected} onFav={toggleFav} setUser={setUser} toast={toast}/>}
      {route==="account" && !user && <div className="container page" style={{paddingTop:50}}><div className="empty">נא להתחבר תחילה.</div></div>}

      {route==="admin" && <AdminPage dresses={dresses} setDresses={setDresses} toast={toast}/>}

      {selected && <DetailModal d={selected} fav={favIds.includes(selected.id)} onFav={toggleFav} onClose={()=>setSelected(null)} toast={toast}/>}

      <footer className="footer">
        <div className="footer-inner">
          <div>
            <h4>onenight</h4>
            <p style={{margin:0}}>השכרת שמלות ערב · קהילה של נשים<br/>שמלה אחת, ערב אחד, זיכרון לכל החיים.</p>
          </div>
          <div>
            <h4>ניווט</h4>
            <p style={{margin:0,lineHeight:2}}>
              <a onClick={()=>go("home")}>בית</a><br/>
              <a onClick={()=>go("publish")}>פרסום שמלה</a><br/>
              <a onClick={()=>go("favorites")}>מועדפים</a>
            </p>
          </div>
          <div>
            <h4>יצירת קשר</h4>
            <p style={{margin:0,lineHeight:2}}>
              מייל: hello@onenight.co.il<br/>
              וואטסאפ: 03-0000000<br/>
              <a onClick={()=>toast("תקנון האתר")}>תקנון ותנאי שימוש</a>
            </p>
          </div>
        </div>
        <div style={{textAlign:"center",marginTop:30,fontSize:12,color:"var(--muted)"}}>© {new Date().getFullYear()} onenight · כל הזכויות שמורות</div>
      </footer>

      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
